name: Publish and update viewer

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

jobs:
  package-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: version
        run: |
          previous_version="$(git show '${{ github.event.before }}:package.json' | jq -r '.version')"
          current_version="$(jq -r '.version' package.json)"
          echo "changed=$([[ "$current_version" != "$previous_version" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish:
    needs: package-version
    if: needs.package-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: make build

      - id: package
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - run: npm publish ./pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-viewer:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: KittyCAD/viewer
          ref: main
          token: ${{ secrets.VIEWER_REPOSITORY_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install @kittycad/kcl-wasm-lib@latest @kittycad/lib@latest "@kittycad/web-view@${{ needs.publish.outputs.version }}"

      - name: Commit updated dependencies
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update KittyCAD web dependencies"
          git push origin main

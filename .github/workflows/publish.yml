name: Publish and update viewer

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: make build

      - id: package
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - run: npm publish ./pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-viewer:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: KittyCAD/viewer
          ref: main
          token: ${{ secrets.VIEWER_REPOSITORY_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install @kittycad/kcl-wasm-lib@latest @kittycad/lib@latest "@kittycad/web-view@${{ needs.publish.outputs.version }}"

      - name: Commit updated dependencies
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update KittyCAD web dependencies" -m "Source workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          latest_tag="$(git describe --tags --abbrev=0)"
          next_tag="$(node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); console.log(`${major}.${minor}.${patch + 1}`)' "$latest_tag")"
          npm version "$next_tag" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "Bump viewer version to $next_tag" -m "Source workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin main
          git tag "$next_tag"
          git push origin "$next_tag"

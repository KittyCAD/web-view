name: Publish and update dependents

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      lib_version: ${{ steps.package.outputs.lib_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: make build

      - id: package
        run: |
          echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "lib_version=$(jq -r '.packages["node_modules/@kittycad/lib"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Publish package if needed
        env:
          WEB_VIEW_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "@kittycad/web-view@$WEB_VIEW_VERSION" version > /dev/null 2>&1; then
            echo "@kittycad/web-view@$WEB_VIEW_VERSION is already published"
          else
            npm publish ./pkg
          fi

      - name: Wait for package availability
        env:
          WEB_VIEW_VERSION: ${{ steps.package.outputs.version }}
        run: |
          for delay in 0 2 4 8 16 32 64 128 256 512; do
            sleep "$delay"
            npm view "@kittycad/web-view@$WEB_VIEW_VERSION" version && exit 0
          done
          exit 1

  update-viewer:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GH_ORG_APP_ID }}
          private-key: ${{ secrets.GH_ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: viewer
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          repository: KittyCAD/viewer
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # The kcl-wasm-lib dependency is updated by its repository's CI to
      # guarantee the correct version.
      - run: npm install "@kittycad/lib@${{ needs.publish.outputs.lib_version }}" "@kittycad/web-view@${{ needs.publish.outputs.version }}"

      - name: Commit updated dependencies
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update kittycad/web-view dependency" -m "Trigger by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          npm version patch --no-git-tag-version
          version="$(jq -r '.version' package.json)"
          git add package.json package-lock.json
          git commit -m "Trigger release via version bump to $version" -m "Trigger by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin main
          git tag "$version"
          git push origin "$version"

  update-api:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GH_ORG_APP_ID }}
          private-key: ${{ secrets.GH_ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: api
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v6
        with:
          repository: KittyCAD/api
          ref: main
          path: api
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/admin-dashboard/app/package-lock.json

      - name: Update KittyCAD web dependencies
        working-directory: api/admin-dashboard/app
        run: npm install "@kittycad/lib@${{ needs.publish.outputs.lib_version }}" "@kittycad/web-view@${{ needs.publish.outputs.version }}"

      - name: Open API dependency pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: api
          branch: automation/web-view-${{ needs.publish.outputs.version }}
          base: main
          delete-branch: true
          add-paths: |
            admin-dashboard/app/package.json
            admin-dashboard/app/package-lock.json
          commit-message: |
            Update KittyCAD web dependencies

            Trigger by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          title: Update KittyCAD web dependencies
          body: ''
